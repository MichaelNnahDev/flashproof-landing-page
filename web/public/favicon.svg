<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Shield Badge -->
  <path d="M32 4L10 12V28C10 44 19.5 54.5 32 60C44.5 54.5 54 44 54 28V12L32 4Z" 
        fill="url(#shieldGrad)" 
        stroke="#38bdf8" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Lightning Bolt (Social Proof / Flash) -->
  <path d="M35 15L23 31H33L29 49L43 31H33L35 15Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)" 
        stroke="#ffffff" 
        stroke-width="0.75"
        stroke-linejoin="round"/>
</svg>
